name: Production release

# Creating a stable version tag is the human release confirmation. Ordinary
# branch pushes and PRs run CI only. Agents need explicit version authorization.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize the whole release, including checks and Railway builds. Never cancel a migration.
concurrency:
  group: tabdo-production-release
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
      tagOid: ${{ steps.tag.outputs.tagOid }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.14.1'
          package-manager-cache: false
      - id: tag
        name: Verify new stable tag, exact commit and master ancestry
        run: node scripts/release/git.mjs

  checks:
    needs: authorize
    uses: ./.github/workflows/checks.yml

  production:
    needs: [authorize, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: tabdo / production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.14.1'
          package-manager-cache: false
      # Install outside the checkout, before credentials are available. The
      # release source is exported separately and never contains CLI packages.
      - name: Install pinned Railway CLI in runner temp
        run: npm install --prefix "$RUNNER_TEMP/railway-cli" --no-audit --no-fund @railway/cli@5.71.0
      - name: Upload API, wait for preDeploy and health, then upload worker
        env:
          RELEASE_ENVIRONMENT: tabdo / production
          RELEASE_BOOTSTRAP_READY: ${{ vars.RELEASE_BOOTSTRAP_READY }}
          RELEASE_TAG_OID: ${{ needs.authorize.outputs.tagOid }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID }}
          RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
          RELEASE_PUBLIC_URL: ${{ vars.RELEASE_PUBLIC_URL }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: node scripts/release/run.mjs
      - name: Preserve sanitized release result even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
