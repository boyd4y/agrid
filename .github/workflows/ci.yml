name: CI

on:
  push:
    branches: [master, 'feat/**']
  pull_request:
    branches: [master]

permissions:
  contents: read

# Supersede PR runs only. Every push gets its own group so even pending master
# runs survive newer pushes and report a conclusion for Railway's Wait for CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Build, types and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js and dependency cache
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.14.1' # Keep aligned with Dockerfile.server.
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture boundaries
        run: pnpm check:architecture

      - name: Build all workspace packages
        run: pnpm build

      - name: Check application types
        run: pnpm typecheck

      - name: Check test types
        run: pnpm typecheck:test

      # Initial scope: these complete suites need no database, Redis, browser,
      # model or credentials. Server/queue/browser integration is separate.
      - name: Test environment guards
        run: pnpm test:env

      - name: Test shared contracts, UI, SDK and client
        run: pnpm -r --filter @tabdo/shared --filter @tabdo/ui --filter @tabdo/sdk --filter @tabdo/client test
