    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="/tabdo-mark.svg" />

    <meta name="description" content="把想做的事告诉 tabdo，让 AI 帮你整理信息、安排步骤并动手完成。你随时可以查看和调整。" />
    <meta property="og:site_name" content="tabdo" />
    <meta property="og:title" content="tabdo · 让想法，动起来。" />
    <meta property="og:description" content="把想做的事告诉 tabdo，让 AI 帮你整理信息、安排步骤并动手完成。你随时可以查看和调整。" />

    <link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt" />
    <script>
      (function () {
        var t = "system";
        try {
          var stored = localStorage.getItem("table-theme");
          if (stored === "light" || stored === "dark" || stored === "system") t = stored;
        } catch (e) {}
        var dark =
          t === "dark" ||
          (t === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
        document.documentElement.setAttribute(
          "data-theme",
          dark ? "dark" : "light"
        );
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.getElementById("tabdo-favicon").setAttribute(
          "href",
          "/brand/tabdo-favicon-" + (dark ? "dark" : "light") + ".svg"
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
