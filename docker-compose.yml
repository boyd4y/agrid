services:
  postgres:
    image: postgres:17-alpine
    container_name: feishu-notion-table-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tableapp
      POSTGRES_PASSWORD: tableapp
      POSTGRES_DB: tableapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory, 512mb, --maxmemory-policy, noeviction]
    ports:
      - "127.0.0.1:${AGRID_REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
